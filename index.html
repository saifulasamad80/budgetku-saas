<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BudgetKu SaaS - Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-4 md:p-8 font-sans text-slate-800 min-h-screen">
  <div class="max-w-6xl mx-auto space-y-6">

    <!-- 1. HEADER (LENGKAP DENGAN KODE GABUNG & PROFILE DROPDOWN) -->
    <header class="flex items-center justify-between bg-white p-4 rounded-xl shadow-sm border border-slate-100">
      <div class="flex items-center gap-3">
        <button id="btn-back" class="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-600" title="Kembali ke Daftar Organisasi">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        <div>
          <h1 id="workspace-title" class="text-xl font-bold text-slate-900">Memuat Organisasi...</h1>
          <span id="user-role-badge" class="inline-block text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider bg-slate-100 text-slate-600">
            USER
          </span>
        </div>
      </div>

      <!-- KANAN HEADER: TOMBOL KODE GABUNG + DROPDOWN PROFIL -->
      <div class="flex items-center gap-2">
        <button id="btn-join-code" class="px-3 py-1.5 bg-indigo-50 text-indigo-700 font-semibold text-xs rounded-lg hover:bg-indigo-100 transition-colors flex items-center gap-1.5">
          <span>👥</span> Kode Gabung
        </button>

        <!-- PROFILE DROPDOWN MENU -->
        <div class="relative">
          <button id="btn-profile-toggle" class="flex items-center gap-2 p-1.5 hover:bg-slate-100 rounded-lg transition-colors border border-transparent hover:border-slate-200">
            <div id="user-avatar" class="w-8 h-8 rounded-full bg-slate-800 text-white font-bold flex items-center justify-center text-xs shadow-sm">
              U
            </div>
            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>

          <!-- DROPDOWN POPUP -->
          <div id="profile-dropdown-menu" class="hidden absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-lg border border-slate-100 py-1.5 z-50">
            <div class="px-4 py-2 border-b border-slate-100">
              <p class="text-[10px] text-slate-400">Login sebagai</p>
              <p id="dropdown-email" class="text-xs font-bold text-slate-800 truncate">-</p>
            </div>
            
            <button id="btn-switch-workspace" class="w-full text-left px-4 py-2 text-xs text-slate-600 hover:bg-slate-50 flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
              </svg>
              Ganti Organisasi
            </button>

            <!-- TOMBOL BUAT ORGANISASI BARU -->
            <button id="btn-create-workspace" class="w-full text-left px-4 py-2 text-xs font-semibold text-indigo-600 hover:bg-indigo-50 flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
              </svg>
              + Buat Organisasi Baru
            </button>

            <div class="border-t border-slate-100 my-1"></div>
            
            <button id="btn-logout" class="w-full text-left px-4 py-2 text-xs font-semibold text-rose-600 hover:bg-rose-50 flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
              </svg>
              Keluar / Logout
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- 2. SUMMARY CARDS -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-xl border border-slate-100 shadow-sm">
        <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Sisa Saldo Kas</p>
        <p id="card-saldo" class="text-2xl font-extrabold text-slate-900">Rp 0</p>
      </div>
      <div class="bg-emerald-50/50 p-5 rounded-xl border border-emerald-100 shadow-sm">
        <p class="text-[11px] font-bold uppercase tracking-wider text-emerald-600 mb-1">Pemasukan</p>
        <p id="card-pemasukan" class="text-2xl font-extrabold text-emerald-600">Rp 0</p>
      </div>
      <div class="bg-rose-50/50 p-5 rounded-xl border border-rose-100 shadow-sm">
        <p class="text-[11px] font-bold uppercase tracking-wider text-rose-500 mb-1">Pengeluaran</p>
        <p id="card-pengeluaran" class="text-2xl font-extrabold text-rose-500">Rp 0</p>
      </div>
    </div>

    <!-- 3. RIWAYAT TRANSAKSI -->
    <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="font-bold text-slate-800">Riwayat Transaksi</h2>
        <div class="flex gap-2">
          <button class="px-3 py-1.5 bg-emerald-600 text-white text-xs font-bold rounded-lg hover:bg-emerald-700 transition-colors">CSV</button>
          <button class="px-3 py-1.5 bg-rose-600 text-white text-xs font-bold rounded-lg hover:bg-rose-700 transition-colors">PDF</button>
        </div>
      </div>
      <div id="tx-container" class="divide-y divide-slate-100">
        <p class="text-xs text-slate-400 py-4 text-center">Memuat riwayat transaksi...</p>
      </div>
    </div>

    <!-- 4. KELOLA ANGGOTA & PERAN -->
    <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm space-y-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-purple-600">👥</span>
          <h2 class="font-bold text-slate-800">Kelola Anggota & Peran</h2>
        </div>
        <span class="text-[10px] font-bold bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-md uppercase">
          KHUSUS ADMIN
        </span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead>
            <tr class="border-b border-slate-100 text-slate-400 font-bold uppercase tracking-wider">
              <th class="py-3 px-2">EMAIL</th>
              <th class="py-3 px-2">ROLE</th>
              <th class="py-3 px-2 text-right">AKSI</th>
            </tr>
          </thead>
          <tbody id="members-table-body" class="divide-y divide-slate-100">
            <tr>
              <td colspan="3" class="py-4 text-center text-slate-400">Memuat anggota...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- JAVASCRIPT LOGIC (FIREBASE V10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, collection, onSnapshot, getDocs, updateDoc, deleteDoc, addDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBqt0A9MIawPhLcIu_yOGiG4VG5-m4ZNgw",
      authDomain: "budgetku-e4ece.firebaseapp.com",
      projectId: "budgetku-e4ece",
      storageBucket: "budgetku-e4ece.firebasestorage.app",
      messagingSenderId: "718142379650",
      appId: "1:718142379650:web:1fb64c6e75a8539d51869b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let activeWorkspaceId = new URLSearchParams(window.location.search).get('id') || localStorage.getItem('activeWorkspaceId');
    let currentUser = null;
    let currentUserRole = "USER";

    // TOGGLE PROFILE DROPDOWN
    const btnToggle = document.getElementById('btn-profile-toggle');
    const dropdownMenu = document.getElementById('profile-dropdown-menu');

    btnToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('hidden');
    });

    document.addEventListener('click', () => {
      dropdownMenu.classList.add('hidden');
    });

    // NAVIGATION HANDLERS
    document.getElementById('btn-back').onclick = () => window.location.href = '/';
    document.getElementById('btn-switch-workspace').onclick = () => window.location.href = '/';

    document.getElementById('btn-join-code').onclick = () => {
      if (activeWorkspaceId) {
        alert(`Kode Workspace Anda: ${activeWorkspaceId}`);
      }
    };

    // LOGIKA BUAT ORGANISASI BARU
    document.getElementById('btn-create-workspace').onclick = async () => {
      if (!currentUser) {
        alert("Sesi login tidak valid. Silakan login ulang.");
        return;
      }

      const workspaceName = prompt("Masukkan Nama Organisasi / Kas Baru Anda:");
      if (!workspaceName || !workspaceName.trim()) return;

      try {
        // 1. Tambah dokumen baru di koleksi workspaces
        const wsRef = await addDoc(collection(db, "workspaces"), {
          name: workspaceName.trim(),
          createdAt: new Date().toISOString(),
          createdBy: currentUser.uid
        });

        // 2. Daftarkan pembuat sebagai ADMIN di sub-koleksi members
        await setDoc(doc(db, "workspaces", wsRef.id, "members", currentUser.uid), {
          email: currentUser.email,
          role: "admin",
          joinedAt: new Date().toISOString()
        });

        // 3. Simpan ke LocalStorage dan alihkan URL
        localStorage.setItem('activeWorkspaceId', wsRef.id);
        alert(`Organisasi "${workspaceName.trim()}" berhasil dibuat!`);
        window.location.search = `?id=${wsRef.id}`;
      } catch (err) {
        alert("Gagal membuat organisasi: " + err.message);
      }
    };

    // LOGOUT HANDLER
    document.getElementById('btn-logout').onclick = async () => {
      await signOut(auth);
      window.location.href = '/login.html';
    };

    // AUTH & FIRESTORE REAL-TIME LISTENERS
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '/login.html';
        return;
      }

      currentUser = user;
      document.getElementById('dropdown-email').innerText = user.email;
      document.getElementById('user-avatar').innerText = user.email.charAt(0).toUpperCase();

      // CARI OTOMATIS JIKA WORKSPACE ID KOSONG
      if (!activeWorkspaceId) {
        try {
          const wsSnap = await getDocs(collection(db, "workspaces"));
          if (!wsSnap.empty) {
            activeWorkspaceId = wsSnap.docs[0].id;
            localStorage.setItem('activeWorkspaceId', activeWorkspaceId);
          } else {
            alert("Belum ada organisasi yang terdaftar!");
            return;
          }
        } catch (err) {
          console.error("Gagal memuat workspace:", err);
          return;
        }
      }

      // 1. LISTEN WORKSPACE DATA
      onSnapshot(doc(db, "workspaces", activeWorkspaceId), (docSnap) => {
        if (docSnap.exists()) {
          document.getElementById('workspace-title').innerText = docSnap.data().name || "Organisasi";
        }
      });

      // 2. LISTEN ANGGOTA & HAPUS ANGGOTA
      onSnapshot(collection(db, "workspaces", activeWorkspaceId, "members"), (snapshot) => {
        const tbody = document.getElementById('members-table-body');
        tbody.innerHTML = '';

        const memberList = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        const myData = memberList.find(m => m.id === user.uid);
        
        if (myData) {
          currentUserRole = (myData.role || "USER").toUpperCase();
          const badge = document.getElementById('user-role-badge');
          badge.innerText = currentUserRole;
          badge.className = `inline-block text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider ${
            currentUserRole === "ADMIN" ? "bg-purple-100 text-purple-700" :
            currentUserRole === "EDITOR" ? "bg-blue-100 text-blue-700" : "bg-emerald-100 text-emerald-700"
          }`;
        }

        memberList.forEach(member => {
          const isMe = member.id === user.uid;
          const displayEmail = member.email || member.userEmail || (isMe ? user.email : "Email tidak tersedia");

          const tr = document.createElement('tr');
          tr.className = "hover:bg-slate-50/50";

          tr.innerHTML = `
            <td class="py-3 px-2 font-medium text-slate-700">
              ${displayEmail} ${isMe ? '<span class="text-indigo-600 font-bold">(Anda)</span>' : ''}
            </td>
            <td class="py-3 px-2">
              <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                member.role === "admin" ? "bg-purple-100 text-purple-700" :
                member.role === "editor" ? "bg-blue-100 text-blue-700" : "bg-slate-100 text-slate-600"
              }">${member.role || "user"}</span>
            </td>
            <td class="py-3 px-2 text-right">
              ${isMe ? '<span class="text-slate-300 font-bold mr-3">-</span>' : `
                <div class="flex items-center justify-end gap-2">
                  ${currentUserRole === "ADMIN" ? `
                    <select data-id="${member.id}" class="role-select bg-slate-50 border border-slate-200 rounded px-1.5 py-1 text-xs">
                      <option value="user" ${member.role === 'user' ? 'selected' : ''}>User</option>
                      <option value="editor" ${member.role === 'editor' ? 'selected' : ''}>Editor</option>
                      <option value="admin" ${member.role === 'admin' ? 'selected' : ''}>Admin</option>
                    </select>

                    <button data-id="${member.id}" data-email="${displayEmail}" class="btn-delete-member p-1.5 text-rose-500 hover:text-rose-700 hover:bg-rose-50 rounded transition-colors" title="Keluarkan Anggota">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                      </svg>
                    </button>
                  ` : '<span class="text-slate-300 font-bold mr-3">-</span>'}
                </div>
              `}
            </td>
          `;
          tbody.appendChild(tr);
        });

        // Event Listener: Ubah Role
        document.querySelectorAll('.role-select').forEach(select => {
          select.onchange = async (e) => {
            const mId = e.target.dataset.id;
            await updateDoc(doc(db, "workspaces", activeWorkspaceId, "members", mId), { role: e.target.value });
          };
        });

        // Event Listener: Hapus Anggota
        document.querySelectorAll('.btn-delete-member').forEach(btn => {
          btn.onclick = async () => {
            const mId = btn.dataset.id;
            const mEmail = btn.dataset.email;
            if (confirm(`Apakah Anda yakin ingin mengeluarkan ${mEmail} dari organisasi ini?`)) {
              try {
                await deleteDoc(doc(db, "workspaces", activeWorkspaceId, "members", mId));
                alert("Anggota berhasil dikeluarkan.");
              } catch (err) {
                alert("Gagal mengeluarkan anggota: " + err.message);
              }
            }
          };
        });
      });

      // 3. LISTEN TRANSAKSI & KALKULASI SALDO
      onSnapshot(collection(db, "workspaces", activeWorkspaceId, "transactions"), (snapshot) => {
        const container = document.getElementById('tx-container');
        container.innerHTML = '';

        let inTotal = 0;
        let outTotal = 0;

        if (snapshot.empty) {
          container.innerHTML = '<p class="text-xs text-slate-400 py-4 text-center">Belum ada riwayat transaksi.</p>';
        } else {
          snapshot.docs.forEach(d => {
            const tx = d.data();
            const amt = Number(tx.amount || 0);
            if (tx.type === "IN" || amt > 0) inTotal += amt;
            else outTotal += Math.abs(amt);

            const div = document.createElement('div');
            div.className = "py-3 flex items-center justify-between";
            div.innerHTML = `
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold ${tx.type === 'IN' || amt > 0 ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}">
                  ${tx.type === 'IN' || amt > 0 ? '↑' : '↓'}
                </div>
                <div>
                  <p class="text-sm font-semibold text-slate-800">${tx.title || tx.description || 'Transaksi'}</p>
                  <span class="text-[10px] text-slate-400 bg-slate-100 px-2 py-0.5 rounded">${tx.category || 'Umum'}</span>
                </div>
              </div>
              <p class="text-sm font-bold ${tx.type === 'IN' || amt > 0 ? 'text-emerald-600' : 'text-rose-600'}">
                ${tx.type === 'IN' || amt > 0 ? '+' : '-'}Rp ${Math.abs(amt).toLocaleString('id-ID')}
              </p>
            `;
            container.appendChild(div);
          });
        }

        document.getElementById('card-pemasukan').innerText = `Rp ${inTotal.toLocaleString('id-ID')}`;
        document.getElementById('card-pengeluaran').innerText = `Rp ${outTotal.toLocaleString('id-ID')}`;
        document.getElementById('card-saldo').innerText = `Rp ${(inTotal - outTotal).toLocaleString('id-ID')}`;
      });
    });
  </script>
</body>
</html>
