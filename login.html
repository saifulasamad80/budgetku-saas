<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - BudgetKu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
        <h1 class="text-2xl font-bold text-center text-indigo-600 mb-6 tracking-tight" id="form-title">Masuk ke BudgetKu</h1>
        
        <form id="auth-form" class="flex flex-col gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" required placeholder="nama@email.com" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-gray-50">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" required minlength="6" placeholder="Minimal 6 karakter" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-gray-50">
            </div>
            
            <button type="submit" id="btn-submit" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl mt-4 shadow-sm transition duration-150 active:bg-indigo-700">
                Masuk
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            <span id="toggle-text">Belum punya akun?</span> 
            <button id="btn-toggle" class="text-indigo-600 font-semibold hover:underline focus:outline-none">Daftar sekarang</button>
        </p>
    </div>

    <!-- Script Firebase Auth -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // WAJIB: Ganti dengan konfigurasi proyek Anda
        const firebaseConfig = {
            apiKey: "AIzaSyBqt0A9MIawPhLcIu_yOGiG4VG5-m4ZNgw",
            authDomain: "budgetku-e4ece.firebaseapp.com",
            projectId: "budgetku-e4ece",
            storageBucket: "budgetku-e4ece.firebasestorage.app",
            messagingSenderId: "718142379650",
            appId: "1:718142379650:web:1fb64c6e75a8539d51869b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let isLogin = true;
        
        const form = document.getElementById('auth-form');
        const title = document.getElementById('form-title');
        const btnSubmit = document.getElementById('btn-submit');
        const btnToggle = document.getElementById('btn-toggle');
        const toggleText = document.getElementById('toggle-text');

        // Toggle antara mode Login dan Register
        btnToggle.addEventListener('click', () => {
            isLogin = !isLogin;
            title.innerText = isLogin ? "Masuk ke BudgetKu" : "Daftar Akun Baru";
            btnSubmit.innerText = isLogin ? "Masuk" : "Daftar";
            toggleText.innerText = isLogin ? "Belum punya akun?" : "Sudah punya akun?";
            btnToggle.innerText = isLogin ? "Daftar sekarang" : "Masuk di sini";
        });

        // Eksekusi Autentikasi
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Memproses...";

            try {
                if (isLogin) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
                
                // Dugaan kuat struktur web lokal Anda berjalan di root direktori yang sama.
                // Jika sukses, lempar pengguna ke Workspace Portal.
                window.location.href = './index.html';
                
            } catch (error) {
                console.error("Kesalahan Autentikasi:", error);
                
                // Penanganan pesan error ke bahasa yang lebih ramah pengguna
                let errorMsg = "Terjadi kesalahan.";
                if (error.code === 'auth/email-already-in-use') errorMsg = "Email sudah terdaftar.";
                else if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') errorMsg = "Email atau password salah.";
                else if (error.code === 'auth/user-not-found') errorMsg = "Akun tidak ditemukan.";
                
                alert("Gagal: " + errorMsg);
                btnSubmit.disabled = false;
                btnSubmit.innerText = isLogin ? "Masuk" : "Daftar";
            }
        });
    </script>
</body>
</html>
